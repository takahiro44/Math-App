# これは開発環境専用。
# 本番はバックエンドが Cloud Run、フロントエンドが Vercel。手順は docs/deploy.md を参照。
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      # インデックス構築 (scripts/build_index.py) 用。実行時には参照しない。
      - ./rag/documents:/app/rag/documents
    env_file:
      - .env
    # 本番の CMD（reload なし・PORT 環境変数対応）を、開発用に --reload 付きで上書きする。
    # `uv run` は使わない。非rootで動かしているため /app/.venv に書き込めず、
    # `uv run` が起動時に環境を同期しようとして失敗する。venv の uvicorn を直叩きする。
    command: .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
