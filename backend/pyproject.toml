[project]
name = "math-app-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "langchain",
    "langchain-google-genai",
    "pydantic",
    "python-dotenv",
    "numpy",
]

[dependency-groups]
# インデックス構築 (scripts/build_index.py) 専用。実行時には不要。
build = [
    "pypdf",
    "langchain-text-splitters",
]
# 開発用スクリプト専用（app/check_models.py が埋め込み対応モデルを一覧する）。
dev = [
    "google-generativeai",
]
